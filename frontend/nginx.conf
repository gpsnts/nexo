server {
  listen 80;
  root /usr/share/nginx/html;

  # Cabeçalhos de segurança (ADR 0012). Referrer-Policy importa porque os links de e-mail levam o token na URL.
  # HSTS fica a cargo do Caddy (HTTPS), não daqui.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend:8080/;
    # O backend limita por IP; precisa do IP real, que ele lê de X-Forwarded-For (server.forward-headers-strategy=native).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri /index.html; }
}
