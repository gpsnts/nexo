server {
  listen 80;
  root /usr/share/nginx/html;

  # Cabeçalhos de segurança (ADR 0012). Referrer-Policy importa porque os links de e-mail levam o token na URL.
  # HSTS fica a cargo do Caddy (HTTPS), não daqui.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Envio de material: até 20 MB (nexo.tamanho-maximo-mb) mais o envelope multipart, e a inspeção do arquivo roda dentro da requisição.
  # Só esta rota aceita corpo grande; o restante da API fica no limite padrão de 1 MB.
  location ^~ /api/materiais {
    client_max_body_size 21m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    include /etc/nginx/conf.d/proxy-api.inc;
  }
  location /api/ {
    include /etc/nginx/conf.d/proxy-api.inc;
  }
  location / { try_files $uri /index.html; }
}
