[project]
name = "nexo-processamento"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-multipart>=0.0.9", "pdfplumber>=0.11", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexo_processamento*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["real: usa o provedor real (precisa de chave); pule sem ela"]
addopts = "-m 'not real'"
