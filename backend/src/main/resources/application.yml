spring:
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000   # sem timeout o JavaMail espera para sempre e prende as threads do segundo plano
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  application.name: nexo-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/nexo
    username: nexo_app   # nunca o papel dono: a RLS não vale para ele
    password: ${NEXO_APP_SENHA:}
  jpa.open-in-view: false
  servlet.multipart:
    max-file-size: 21MB     # o limite de 20 MB do produto é conferido no código (nexo.tamanho-maximo-mb); aqui só o teto do parser
    max-request-size: 22MB
  flyway.enabled: false  # migrações rodam no serviço "migracao" do compose, com o papel dono

management.endpoints.web.exposure.include: health

server.forward-headers-strategy: native  # IP real do cliente vem do X-Forwarded-For do nginx (ADR 0012)

# Parâmetros de negócio (CLAUDE.md). Sobrescreva por variável de ambiente (ex.: NEXO_LIMITE_OPERACOES_POR_HORA).
nexo:
  ambiente: desenvolvimento              # desenvolvimento | producao: em producao a aplicacao recusa subir com configuracao insegura (ADR 0017)
  formatos-aceitos: [pdf, docx, txt]
  tamanho-maximo-mb: 20
  paginas-maximas: 50
  limite-operacoes-por-hora: 30        # operações com IA (registros em registro_geracao) por usuário na janela abaixo
  janela-operacoes: PT1H
  tentativas-por-questao: 3
  questoes-por-sessao-revisao: 20
  fuso: America/Sao_Paulo
  limiar-similaridade-repeticao: 0.90
  figuras-por-material: 30
  limite-gasto-usd: 10      # confirmado (ADR 0029): US$ 10 por 30 dias
  janela-gasto: P30D
  revisao:
    repeticoes-inicial: 0
    intervalo-inicial: 1
    fator-inicial: 2.50
    fator-maximo: 2.50
    fator-minimo: 1.30
    fator-acerto: 0.10
    fator-erro: 0.20
    intervalo-maximo: 365
  processamento:
    url: http://localhost:8000
    # segredo vem de NEXO_PROCESSAMENTO_SEGREDO (o mesmo do serviço Python); sem valor padrão de propósito
    timeout: PT2M                         # extração de um material de 50 páginas
    tentativas: 3                         # 5xx e falha de rede; 4xx não é repetido
    espera: PT1S                          # multiplicada pelo número da tentativa
    saude-timeout: PT3S                   # consulta dos nomes dos modelos (/saude): uma tentativa só, para falhar rápido com o serviço fora do ar
    cache-modelos: PT1M                   # os nomes dos modelos mudam só com reinício do serviço: não consultar a cada operação
  material:
    diretorio: ./dados/arquivos           # volume do compose em /dados/arquivos (ADR 0024)
    assincrono: true                      # indexação em executor próprio; só os testes rodam na hora
    threads: 2
    fila: 50
    simultaneos-por-usuario: 2            # materiais pendentes ou processando por usuário
    envios-simultaneos: 4                 # POST /materiais em curso no servidor todo (cada um segura ~60 MB de arquivo em memória)
    caracteres-por-pagina: 3000           # estimativa de páginas de DOCX e TXT (ADR 0024)
    lote-embeddings: 64
    pulso-maximo: PT5M                    # sem progresso por este tempo e sem tarefa viva: material vira falhou/interrompido
    trechos-minimos-por-topico: 1         # divisão por estrutura: seção menor que isto se junta à vizinha (1 = cada título vira um tópico, ADR 0043)
    trechos-por-topico-plano-b: 15        # divisão em blocos iguais quando o modelo não propõe tópicos válidos
    max-topicos: 100
    esperas-remocao: [PT1S, PT10S, PT1M]  # novas tentativas de apagar arquivo depois do commit
    precos-embedding-usd-por-milhao:      # por nome do modelo; o provedor falso custa 0
      text-embedding-3-small: 0.02
    preco-embedding-usd-por-milhao: ${PRECO_EMBEDDING_USD_POR_MILHAO:}   # para outro modelo de embedding (ex.: o 3-large): valor do painel do provedor; sem preço o modelo é recusado
  geracao:                                # resumo, questões e verificação de fidelidade (F3, ADR 0034)
    assincrono: true                      # executor próprio; só os testes rodam na hora
    threads: 2
    fila: 20
    pulso-maximo: PT5M                    # sem progresso por este tempo e sem tarefa viva: a operação vira falhou
    contexto-max-caracteres: 24000        # conteúdo-base enviado ao modelo (cerca de 6 mil tokens)
    questoes-por-pedido: 10
    questoes-por-topico: 50
    preco-linguagem:                      # modelo de linguagem real: US$ por milhão de tokens (confira no painel do provedor); vazio = só provedor falso
      entrada-usd-por-milhao: ${PRECO_LINGUAGEM_ENTRADA_USD_POR_MILHAO:}
      saida-usd-por-milhao: ${PRECO_LINGUAGEM_SAIDA_USD_POR_MILHAO:}
    simultaneas-por-usuario: 2            # gerações (resumo ou questões) abertas por usuário: um usuário não ocupa sozinho o executor e a fila de todos
    resumos-por-topico: 10                # os mais recentes ficam; ao passar disto o mais antigo sai junto com o novo resumo
    enunciados-a-evitar: 40               # perguntas já existentes citadas no pedido para não repetir
  jwt:
    # segredo vem de NEXO_JWT_SEGREDO (mín. 32 caracteres); sem valor padrão de propósito
    validade-acesso: PT15M
    validade-refresh: P7D
  login:
    max-tentativas: 5
    duracao-bloqueio: PT15M
  conta:
    validade-redefinicao: PT30M
    validade-confirmacao-email: P1D
    pedidos-por-hora: 3
    url-frontend: http://localhost:3000   # base dos links enviados por e-mail
    cookie-seguro: true                   # Secure no cookie do refresh; localhost é aceito como seguro pelos navegadores
    caminho-cookie: /api/auth             # caminho visto pelo navegador (o proxy remove /api)
    dias-conta-nao-verificada: 30         # conta que nunca confirmou o e-mail é apagada depois disto
    fila-segundo-plano: 200               # tarefas pendentes; acima disso o trabalho é descartado com log de erro
    assincrono: true                      # e-mails e trabalho de recuperação de senha em segundo plano (ADR 0012)
    limpeza-cron: "0 30 3 * * *"           # apaga sessões e tokens vencidos (fuso: nexo.fuso)
  limite-publico:                         # por IP, nas rotas públicas que custam um hash Argon2 (ADR 0012)
    requisicoes: 20
    janela: PT1M
  seguranca:
    hash-concorrencia: 4                  # hashes Argon2 simultâneos (cada um usa ~16 MiB)
    hash-espera: PT5S
  email:
    provedor: falso                       # falso (registra o link no log) | smtp (spring.mail.*)
    remetente: nao-responda@nexo.local
